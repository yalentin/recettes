<!DOCTYPE html>
<html lang="fr" data-style="glass" data-img="on" data-dark>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recettes</title>
<!-- Icônes : onglet du navigateur (SVG, repli PNG), écran d'accueil de
     l'iPhone (apple-touch-icon, 180 px, sans transparence : iOS arrondit
     lui-même les coins), et aperçu quand on partage le lien. -->
<link rel="icon" href="icones/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Recettes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="Carnet de recettes">
<meta property="og:description" content="Mes recettes, avec un planificateur de courses.">
<meta property="og:image" content="https://yalentin.github.io/recettes/icones/icone-512.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Les polices du thème en vigueur (Vintage) sont chargées ICI, pas à la
     demande : chargées après coup, le premier rendu se faisait dans une
     autre police et sautait visiblement. Les polices des thèmes en sommeil
     restent, elles, chargées à la demande. -->
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Alfa+Slab+One&display=swap" rel="stylesheet">
<script>
  /* ---------------------------------------------------------------------
     ANTI-FLASH — doit rester ici, en tête, avant toute feuille de style.
     Le thème était posé par le script de fin de page : le temps qu'il
     s'exécute, le navigateur avait déjà peint la page avec les valeurs par
     défaut de :root, c'est-à-dire l'habillage Aqua — d'où le « splash »
     bleu-vert au chargement. On pose donc l'attribut de mode AVANT le
     premier rendu, et les couleurs correspondantes sont écrites en dur
     dans le CSS ci-dessous (et non calculées) pour ce premier rendu.
     Le script de fin recalcule ensuite exactement les mêmes valeurs.
     --------------------------------------------------------------------- */
  /* ===== STYLE PAR DÉFAUT =============================================
     Celui qu'on voit à la première ouverture dans un navigateur. Ensuite,
     c'est le choix fait dans « Apparence » qui compte (tous les styles y
     sont de nouveau accessibles depuis le 3 octobre 2026).
     ==================================================================== */
  var STYLE_DEFAUT = "glass";
  document.documentElement.setAttribute("data-style", STYLE_DEFAUT);
  (function(){
    try{
      var v = localStorage.getItem("carnet_pref_v");
      var d = localStorage.getItem("carnet_dark");
      // "auto" (ou rien) = suivre le réglage clair/sombre du système / du navigateur
      var auto = (v !== "7" || d === null || d === "auto");
      var sombre = auto ? window.matchMedia("(prefers-color-scheme: dark)").matches : (d === "1");
      document.documentElement.toggleAttribute("data-dark", sombre);
      /* Style et couleurs du dernier passage, mémorisés par le menu Apparence
         (un jeu de couleurs par mode) : n'importe quel style s'affiche juste
         dès le premier pixel, pas seulement celui écrit en dur dans le CSS. */
      var st = localStorage.getItem("carnet_style_eff");
      if(st) document.documentElement.setAttribute("data-style", st);
      var vars = localStorage.getItem("carnet_vars_" + (sombre ? "1" : "0"));
      if(st && vars) document.documentElement.setAttribute("style", vars);
      if(localStorage.getItem("carnet_img") === "compact")
        document.documentElement.setAttribute("data-img","compact");
    }catch(e){}
  })();
</script>
<style>
  /* =====================================================================
     COUCHE DE JETONS (design tokens)
     ---------------------------------------------------------------------
     Deux niveaux de personnalisation, tous deux pilotés depuis le menu
     "Apparence" en bas de l'écran :

       1. LE STYLE   -> attribut  <html data-style="glass|vintage|editorial">
                        redéfinit la structure visuelle : polices, rayons,
                        bordures, ombres, reflets, remplissages.
       2. LA PALETTE -> variables de couleur posées en JS sur :root
                        (chaque style embarque ses propres palettes).

     Les règles de MISE EN PAGE (grilles, positions, tailles) ne dépendent
     jamais du style : seule la peau change. Pour ajouter un style, il
     suffit d'ajouter un bloc html[data-style="..."] plus bas et une entrée
     dans le tableau STYLES du script.
     ===================================================================== */
  :root{
    /* ---------- PALETTE (écrasée en JS par le sous-thème couleurs) ---------- */
    --sky1:#8fd6ff; --sky2:#c4efff; --sky3:#dff6ec; --sky4:#eafce0; --sky5:#f2fbe8;
    --ink:#0a3b3f; --ink-soft:#1c5f60; --line:rgba(13,95,82,.28);
    --accent:#12a457; --accent-d:#0b8f4c; --warn:#cf7a2a;
    --acc-l:#5cd889; --acc-glow:rgba(20,150,80,.72); --acc-line:rgba(18,164,87,.4); --acc-soft:rgba(18,164,87,.15);
    --masthead:#0a4a44; --thumb-a:rgba(180,240,255,.45); --thumb-b:rgba(190,245,205,.4); --pickbar:rgba(220,244,252,.75);
    --on-accent:#fff;

    /* ---------- MISE EN PAGE (commune à tous les styles) ---------- */
    --side-w:268px; --grid-min:216px; --grid-gap:22px;
    --ease-pop:cubic-bezier(.34,1.56,.64,1);

    /* ---------- POLICES ---------- */
    --font-ui:"Titillium Web",system-ui,-apple-system,sans-serif;
    --font-display:"Titillium Web",system-ui,-apple-system,sans-serif;
    --font-body:"Newsreader",Georgia,serif;
    --font-text:var(--font-ui);          /* corps de texte : prose, ingrédients, étapes */
    --fs-body:16px; --lh-body:1.5;
    --ls-label:.14em; --tt-label:uppercase; --fw-label:600;
    --ls-title:.005em; --fw-title:700; --lh-title:1.15;
    --font-note:var(--font-ui);          /* notes, encarts, texte en italique */

    /* ---------- FOND DE PAGE ---------- */
    --page-bg:linear-gradient(165deg,var(--sky1) 0%,var(--sky2) 30%,var(--sky3) 58%,var(--sky4) 82%,var(--sky5) 100%);
    --page-attach:fixed;

    /* ---------- FORMES ---------- */
    --radius:16px; --card-radius:20px; --ctl-radius:14px; --pill:20px; --round:50%;

    /* ---------- SURFACES & BORDURES ---------- */
    --bd-w:1px; --bd:rgba(255,255,255,.72);
    --bd-focus:#fff; --bd-on:rgba(255,255,255,.7);
    --surface-side:rgba(255,255,255,.30);
    --surface-card:rgba(255,255,255,.42);
    --surface-ctl:rgba(255,255,255,.55);
    --surface-panel:rgba(255,255,255,.42);
    --surface-hi:#fff; --surface-hi-soft:rgba(255,255,255,.75);
    --ink-a16:rgba(13,95,82,.16); --ink-a30:rgba(13,95,82,.3);   /* recalculés en JS */
    --blur-side:blur(20px) saturate(175%);
    --blur-card:blur(14px) saturate(160%);
    --blur-bar:blur(12px) saturate(160%); --blur-rec:blur(12px);

    /* ---------- OMBRES ---------- */
    --sh-in:inset 0 1px 0 rgba(255,255,255,.9);
    --sh-in-soft:inset 0 1px 0 rgba(255,255,255,.85);
    --sh-field:inset 0 2px 5px rgba(40,120,130,.18),inset 0 1px 0 rgba(255,255,255,.9);
    --sh-field-focus:inset 0 2px 5px rgba(40,120,130,.15),0 0 0 3px var(--acc-line);
    --sh-card:0 12px 26px -16px rgba(0,70,90,.5),inset 0 1px 0 rgba(255,255,255,.85);
    --sh-card-hov:0 26px 38px -20px rgba(0,70,90,.62),inset 0 1px 0 rgba(255,255,255,.95);
    --sh-card-sm:0 10px 22px -14px rgba(0,70,90,.5),inset 0 1px 0 rgba(255,255,255,.85);
    --sh-card-sm-hov:0 20px 30px -18px rgba(0,70,90,.6),inset 0 1px 0 rgba(255,255,255,.95);
    --sh-hero:0 16px 32px -20px rgba(0,70,90,.5),inset 0 1px 0 rgba(255,255,255,.85);
    --sh-bar:0 8px 20px -14px rgba(0,70,90,.5),inset 0 1px 0 rgba(255,255,255,.8);
    --sh-pill:inset 0 1px 0 rgba(255,255,255,.9),0 2px 5px -2px rgba(0,60,90,.25);
    --sh-pill-on:inset 0 1px 0 rgba(255,255,255,.75),0 3px 9px -3px var(--acc-glow);
    --sh-acc:0 9px 18px -6px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.9);
    --sh-acc-hov:0 12px 22px -6px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.9);
    --sh-acc-press:0 5px 10px -5px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.9);
    --sh-num:0 3px 8px -3px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.6);
    --sh-picked:0 14px 28px -14px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.9);

    /* ---------- REMPLISSAGES D'ACCENT ---------- */
    --accent-fill:linear-gradient(var(--acc-l) 0%,var(--accent) 50%,var(--accent-d) 100%);
    --accent-fill-2:linear-gradient(var(--acc-l),var(--accent-d));
    --on-accent-sh:0 -1px 0 rgba(0,70,50,.4);

    /* ---------- EFFETS (0 = neutralisé) ---------- */
    --gloss:1;
    --title-sh:0 1px 2px rgba(255,255,255,.75);
    --label-sh:0 1px 1px rgba(255,255,255,.6);
    --lift:-1px;
    --card-lift:translateY(-8px) scale(1.03);
    --card-lift-press:translateY(-4px) scale(1.01);
    --card-lift-sm:translateY(-5px);
    --press:scale(.93);

    /* ---------- DÉTAILS ---------- */
    --thumb-bg:linear-gradient(160deg,var(--thumb-a),var(--thumb-b));
    --thumb-ratio:4/3;
    --li-border:1px dotted var(--line);
    --sec-border:2px solid var(--acc-line);
    --ph-color:rgba(13,95,82,.78);   /* recalculé en JS depuis --ink */
    --ph-weight:600; --ph-tt:uppercase; --ph-ls:.04em;
    --badge-radius:12px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{color:var(--ink);font-family:var(--font-text);
    font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;min-height:100vh;
    background:var(--page-bg);background-attachment:var(--page-attach);}
  .label{font-family:var(--font-ui);text-transform:var(--tt-label);letter-spacing:var(--ls-label);font-weight:var(--fw-label);}

  .wrap{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh;position:relative;}

  .resize-handle{position:fixed;top:0;bottom:0;left:var(--side-w);width:12px;margin-left:-6px;z-index:30;
    cursor:col-resize;display:flex;align-items:center;justify-content:center;touch-action:none;}
  .resize-handle::before{content:"";width:3px;height:48px;border-radius:3px;background:var(--line);
    box-shadow:var(--sh-in);opacity:0;transition:background .15s,height .15s,width .15s,opacity .15s;}
  /* Au repos, le trait est caché : posé sur le bord de la colonne, il se
     confondait avec l'ascenseur du menu (deux « barres » côte à côte).
     Il apparaît au survol, le curseur col-resize suffit à le signaler. */
  .resize-handle:hover::before,.resize-handle.drag::before{opacity:1;}
  .resize-handle:hover::before,.resize-handle.drag::before{background:var(--accent);height:74px;width:4px;}

  .side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 20px 76px;
    background:var(--surface-side);border-right:var(--bd-w) solid var(--bd);
    backdrop-filter:var(--blur-side);-webkit-backdrop-filter:var(--blur-side);
    box-shadow:var(--sh-in-soft);}
  .side::before{content:"";position:absolute;top:0;left:0;right:0;height:120px;pointer-events:none;opacity:var(--gloss);
    background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0));}
  .masthead{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:.95;margin:0;
    color:var(--masthead);text-shadow:var(--title-sh);position:relative;}
  .masthead small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
    color:var(--ink-soft);margin-top:7px;}
  .rule{height:2px;margin:16px 0;border-radius:2px;
    background:linear-gradient(90deg,var(--acc-line),var(--acc-soft),transparent);}

  .search-wrap{position:relative;}
  .search:placeholder-shown{padding-right:13px !important;}
  .search{width:100%;padding:10px 34px 10px 13px;border:var(--bd-w) solid var(--bd);border-radius:var(--radius);
    background:var(--surface-ctl);font-family:var(--font-ui);font-size:15px;color:var(--ink);font-weight:600;
    box-shadow:var(--sh-field);}
  .search::placeholder{color:var(--ink-soft);opacity:.75;font-weight:400;}
  .search:focus{outline:none;border-color:var(--bd-focus);box-shadow:var(--sh-field-focus);}
  .search-clear{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;border:none;
    border-radius:var(--round);background:var(--ink-a16);color:var(--ink-soft);font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .14s,background .15s;padding:0;}
  .search-clear:hover{background:var(--ink-a30);transform:translateY(-50%) scale(1.14);}

  .facet{margin-top:20px;}
  .facet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .facet-head .label{font-size:11px;color:var(--ink-soft);text-shadow:var(--label-sh);}
  .modebtn{font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:.08em;
    border:var(--bd-w) solid var(--bd);background:var(--surface-ctl);color:var(--ink-soft);
    padding:2px 10px;border-radius:var(--pill);cursor:pointer;line-height:1.5;transition:transform .12s,background .15s,color .15s;
    box-shadow:var(--sh-in);}
  .modebtn:hover{background:var(--surface-hi);transform:translateY(var(--lift));}
  .modebtn:active{transform:scale(.94);}
  .modebtn.et{color:var(--on-accent);border-color:transparent;text-shadow:var(--on-accent-sh);
    background:var(--accent-fill-2);box-shadow:var(--sh-pill-on);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-family:var(--font-ui);font-size:12.5px;font-weight:600;letter-spacing:.01em;
    padding:6px 12px;border-radius:var(--pill);border:var(--bd-w) solid var(--bd);background:var(--surface-ctl);
    color:var(--ink-soft);cursor:pointer;user-select:none;line-height:1.4;
    box-shadow:var(--sh-pill);
    transition:transform .14s var(--ease-pop),background .18s,color .18s,box-shadow .18s;}
  .chip:hover{transform:translateY(var(--lift));background:var(--surface-hi-soft);}
  .chip:active{transform:var(--press);}
  .chip.on{color:var(--on-accent);text-shadow:var(--on-accent-sh);border-color:var(--bd-on);
    background:var(--accent-fill);box-shadow:var(--sh-pill-on);}
  .chip .n{opacity:.6;margin-left:5px;font-weight:700;}
  .chip.on .n{opacity:.85;}

  .filter-toggle{display:none;width:100%;margin-top:16px;padding:10px;border-radius:var(--radius);
    border:var(--bd-w) solid var(--bd);background:var(--surface-ctl);color:var(--ink);font-weight:700;
    font-family:var(--font-ui);font-size:13px;cursor:pointer;box-shadow:var(--sh-in);}

  .main{padding:28px 38px 90px;}
  .topbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px;min-height:22px;}
  .count-h{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);text-shadow:var(--label-sh);}
  .clear{background:var(--surface-ctl);border:var(--bd-w) solid var(--bd);color:var(--accent-d);cursor:pointer;
    font-size:12px;font-family:var(--font-ui);font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:4px 11px;border-radius:var(--pill);box-shadow:var(--sh-in);transition:transform .12s,background .15s;}
  .clear:hover{background:var(--surface-hi);transform:translateY(var(--lift));}
  .clear:active{transform:scale(.95);}
  .active-tags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 22px;}
  .atag{font-family:var(--font-ui);font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
    color:var(--on-accent);text-shadow:var(--on-accent-sh);padding:4px 6px 4px 11px;border-radius:var(--pill);
    display:inline-flex;align-items:center;gap:7px;background:var(--accent-fill-2);
    box-shadow:var(--sh-pill-on);}
  .atag button{background:rgba(255,255,255,.25);border:none;color:var(--on-accent);cursor:pointer;font-size:13px;line-height:1;
    width:17px;height:17px;border-radius:var(--round);padding:0;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .atag button:hover{background:rgba(255,255,255,.45);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--grid-min),1fr));gap:var(--grid-gap);}
  .card{position:relative;border-radius:var(--card-radius);overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;background:var(--surface-card);border:var(--bd-w) solid var(--bd);
    backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);
    box-shadow:var(--sh-card);
    transform-origin:center bottom;will-change:transform;animation:cardPop .4s backwards;
    transition:transform .3s cubic-bezier(.34,1.6,.5,1),box-shadow .3s,background .2s,color .2s;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:46%;z-index:2;pointer-events:none;opacity:var(--gloss);
    background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,0));}
  .card:hover{transform:var(--card-lift);box-shadow:var(--sh-card-hov);}
  .card:active{transform:var(--card-lift-press);}
  .card .shine{position:absolute;top:0;bottom:0;left:-60%;width:45%;z-index:3;pointer-events:none;opacity:var(--gloss);
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.24),transparent);transform:skewX(-18deg);}
  .card:hover .shine{animation:sweep .7s ease .05s;}
  .thumb{aspect-ratio:var(--thumb-ratio);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
    background:var(--thumb-bg);border-bottom:var(--bd-w) solid var(--bd);}
  .thumb::after{content:"";position:absolute;top:0;left:0;right:0;height:52%;pointer-events:none;opacity:var(--gloss);
    background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0));}
  .webbadge{position:absolute;top:8px;right:8px;z-index:4;background:var(--ink);color:var(--sky5);
    font-family:var(--font-ui);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 7px;border-radius:var(--badge-radius);line-height:1.4;opacity:.78;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.34,1.4,.5,1);}
  .card:hover .thumb img{transform:scale(1.08);}
  .thumb .ph{font-family:var(--font-display);font-weight:var(--ph-weight);font-size:13px;letter-spacing:var(--ph-ls);
    text-transform:var(--ph-tt);color:var(--ph-color);text-align:center;padding:16px;line-height:1.3;}
  .card-body{padding:12px 15px 15px;position:relative;z-index:1;}
  .card-tags{font-size:10.5px;color:var(--accent-d);font-weight:700;letter-spacing:.04em;}
  .card-title{font-family:var(--font-display);font-size:18px;font-weight:var(--fw-title);line-height:var(--lh-title);
    letter-spacing:var(--ls-title);margin:5px 0 0;color:var(--ink);}
  .card-meta{font-size:12px;color:var(--ink-soft);margin-top:7px;font-weight:600;letter-spacing:.02em;}
  .empty{color:var(--ink-soft);font-family:var(--font-note);font-style:italic;padding:30px 0;}
  .group-h{grid-column:1/-1;margin:28px 0 2px;font-family:var(--font-ui);font-size:11.5px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);text-shadow:var(--label-sh);
    display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:var(--sec-border);}
  .group-h:first-child{margin-top:2px;}
  .group-n{font-size:11px;font-weight:700;opacity:.55;}

  .detail{display:none;max-width:1040px;}
  .back{display:inline-flex;align-items:center;gap:6px;background:var(--surface-ctl);border:var(--bd-w) solid var(--bd);
    cursor:pointer;color:var(--accent-d);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:var(--ctl-radius);margin-bottom:18px;
    font-family:var(--font-ui);letter-spacing:.03em;text-transform:uppercase;
    box-shadow:var(--sh-in);transition:transform .14s,background .15s;}
  .back:hover{background:var(--surface-hi);transform:translateX(-2px);}
  .d-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
  .d-tag{font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    border:var(--bd-w) solid var(--bd);background:var(--surface-panel);color:var(--accent-d);padding:3px 10px;border-radius:var(--pill);
    box-shadow:var(--sh-in);}
  .d-title{font-family:var(--font-display);font-weight:var(--fw-title);letter-spacing:var(--ls-title);
    font-size:34px;line-height:1.02;margin:4px 0 16px;color:var(--ink);text-shadow:var(--title-sh);}
  .d-hero{border-radius:var(--card-radius);overflow:hidden;margin-bottom:20px;line-height:0;position:relative;
    background:var(--surface-panel);border:var(--bd-w) solid var(--bd);
    box-shadow:var(--sh-hero);}
  .d-hero .webbadge{top:10px;right:10px;font-size:10px;padding:3px 9px;cursor:help;}
  .d-hero img{display:block;width:100%;height:auto;max-height:520px;object-fit:cover;object-position:center;}
  .d-hero .ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:var(--ph-weight);font-size:22px;letter-spacing:var(--ph-ls);
    text-transform:var(--ph-tt);color:var(--ph-color);line-height:1.3;text-align:center;padding:24px;}
  .d-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
  .d-meta div{font-size:11px;background:var(--surface-panel);border:var(--bd-w) solid var(--bd);border-radius:var(--ctl-radius);
    padding:8px 15px;box-shadow:var(--sh-in);}
  .d-meta .label{font-size:9.5px;color:var(--ink-soft);display:block;margin-bottom:2px;}
  .d-meta b{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.01em;color:var(--ink);}

  .d-cols{display:grid;grid-template-columns:312px 1fr;gap:48px;}
  .sec-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
    border-bottom:var(--sec-border);padding-bottom:6px;margin-bottom:14px;}
  .serve{display:inline-flex;align-items:center;border:var(--bd-w) solid var(--bd);border-radius:var(--ctl-radius);overflow:hidden;
    width:fit-content;margin-bottom:18px;background:var(--surface-panel);box-shadow:var(--sh-in);}
  .serve button{width:38px;height:38px;border:none;background:transparent;cursor:pointer;
    font-family:var(--font-ui);font-size:20px;color:var(--accent-d);line-height:1;transition:background .15s,transform .1s;}
  .serve button:hover{background:var(--acc-soft);}
  .serve button:active{transform:scale(.85);}
  .serve .val{min-width:100px;text-align:center;font-family:var(--font-ui);font-weight:600;
    font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}
  .serve .val b{font-size:18px;display:inline-block;transition:transform .18s cubic-bezier(.34,1.7,.5,1);}
  .serve .val b.bump{transform:scale(1.35);}

  ul.ing{list-style:none;margin:0;padding:0;}
  ul.ing li{padding:8px 0;border-bottom:var(--li-border);font-size:15.5px;}
  ul.ing .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;}
  ul.ing .q{font-family:var(--font-ui);font-weight:700;white-space:nowrap;text-align:right;
    display:flex;align-items:center;gap:6px;justify-content:flex-end;color:var(--ink);transition:color .2s;}
  ul.ing .q.flash{color:var(--accent);}
  .wbtn{border:1px solid var(--warn);color:var(--warn);background:var(--surface-ctl);width:18px;height:18px;border-radius:var(--round);
    font-family:var(--font-ui);font-weight:700;font-size:11px;line-height:1;cursor:pointer;padding:0;
    display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s,transform .12s;}
  .wbtn:hover{background:var(--warn);color:var(--sky5);transform:scale(1.12);}
  .wmsg{display:none;font-family:var(--font-note);font-style:italic;font-size:12.5px;color:var(--warn);
    margin-top:5px;line-height:1.35;font-weight:400;text-transform:none;letter-spacing:0;}
  ul.ing li.open .wmsg{display:block;}
  ul.ing .prep{color:var(--ink-soft);font-style:italic;font-size:13.5px;}

  ol.steps{margin:0;padding:0;counter-reset:s;list-style:none;}
  ol.steps li{counter-increment:s;position:relative;padding:0 0 18px 46px;font-size:15.5px;line-height:1.5;}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:var(--round);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-weight:700;font-size:15px;
    color:var(--on-accent);background:var(--accent-fill-2);
    box-shadow:var(--sh-num);}
  .notes{margin-top:24px;padding:14px 18px;border-radius:var(--card-radius);
    background:var(--surface-panel);border:var(--bd-w) solid var(--bd);border-left:4px solid var(--accent);
    font-family:var(--font-note);font-size:14.5px;font-style:italic;color:var(--ink-soft);box-shadow:var(--sh-in-soft);}

  /* ---- Planificateur de courses ---- */
  .plan-btn{position:relative;width:100%;margin:16px 0 4px;padding:12px;border:var(--bd-w) solid var(--bd);
    border-radius:var(--radius);overflow:hidden;color:var(--on-accent);font-family:var(--font-ui);font-weight:700;font-size:12.5px;
    letter-spacing:.04em;text-transform:uppercase;cursor:pointer;text-shadow:var(--on-accent-sh);
    background:var(--accent-fill);
    box-shadow:var(--sh-acc);
    transition:transform .12s var(--ease-pop),box-shadow .12s;}
  .plan-btn::before{content:"";position:absolute;top:1px;left:3px;right:3px;height:45%;pointer-events:none;opacity:var(--gloss);
    border-radius:14px 14px 40px 40px/14px 14px 22px 22px;
    background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.08));}
  .plan-btn:hover{transform:translateY(var(--lift));box-shadow:var(--sh-acc-hov);}
  .plan-btn:active{transform:translateY(1px) scale(.98);box-shadow:var(--sh-acc-press);}
  .plan-btn.ghost{background:var(--surface-ctl);color:var(--accent-d);text-shadow:none;border-color:var(--bd);}
  .plan-btn.ghost::before{opacity:calc(var(--gloss) * .5);}
  .plan-btn.ghost:hover{background:var(--surface-hi);}

  .planner{display:none;max-width:1040px;}
  .pl-title{font-family:var(--font-display);font-weight:var(--fw-title);letter-spacing:var(--ls-title);
    font-size:32px;line-height:1.02;margin:4px 0 6px;color:var(--ink);text-shadow:var(--title-sh);}
  .pl-lead{color:var(--ink-soft);font-size:15.5px;margin:0 0 22px;max-width:640px;}
  .pl-step{font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent-d);border-bottom:var(--sec-border);padding-bottom:6px;margin:26px 0 14px;}
  .pl-facets .facet{margin-top:14px;}
  .pl-facets .facet-head .label{font-size:11px;color:var(--ink-soft);}
  .pl-controls{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;margin:20px 0 4px;}
  .pl-field{display:flex;flex-direction:column;gap:7px;}
  .pl-field .label{font-size:11px;color:var(--ink-soft);}
  .stepper{display:inline-flex;align-items:center;border:var(--bd-w) solid var(--bd);border-radius:var(--ctl-radius);overflow:hidden;
    width:fit-content;background:var(--surface-panel);box-shadow:var(--sh-in);}
  .stepper button{width:36px;height:36px;border:none;background:transparent;cursor:pointer;
    font-family:var(--font-ui);font-size:20px;color:var(--accent-d);line-height:1;transition:background .15s,transform .1s;}
  .stepper button:hover{background:var(--acc-soft);}
  .stepper button:active{transform:scale(.85);}
  .stepper .val{min-width:54px;text-align:center;font-family:var(--font-ui);font-weight:700;font-size:17px;color:var(--ink);}
  .pl-go{position:relative;padding:12px 24px;border:var(--bd-w) solid var(--bd);border-radius:var(--radius);overflow:hidden;
    color:var(--on-accent);font-family:var(--font-ui);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;text-shadow:var(--on-accent-sh);
    background:var(--accent-fill);
    box-shadow:var(--sh-acc);
    transition:transform .12s var(--ease-pop),box-shadow .12s;}
  .pl-go:hover{transform:translateY(var(--lift));box-shadow:var(--sh-acc-hov);}
  .pl-go:active{transform:translateY(1px) scale(.98);}

  .pl-resbar{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:4px;}
  .pl-note{color:var(--warn);font-family:var(--font-note);font-style:italic;font-size:14px;margin:2px 0 0;}
  .pl-recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin:8px 0 4px;}
  .pl-rec{position:relative;border-radius:var(--card-radius);overflow:hidden;padding:12px 15px;display:flex;flex-direction:column;gap:6px;
    background:var(--surface-card);border:var(--bd-w) solid var(--bd);backdrop-filter:var(--blur-rec);-webkit-backdrop-filter:var(--blur-rec);
    box-shadow:var(--sh-card-sm);
    transition:transform .25s cubic-bezier(.34,1.5,.5,1),box-shadow .25s;}
  .pl-rec::before{content:"";position:absolute;top:0;left:0;right:0;height:40%;pointer-events:none;opacity:var(--gloss);
    background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0));}
  .pl-rec:hover{transform:var(--card-lift-sm);box-shadow:var(--sh-card-sm-hov);}
  .pl-rec .pl-rtags{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--accent-d);position:relative;z-index:1;}
  .pl-rec h4{font-family:var(--font-display);font-size:17px;font-weight:var(--fw-title);margin:0;line-height:1.15;
    cursor:pointer;color:var(--ink);position:relative;z-index:1;}
  .pl-rec h4:hover{color:var(--accent-d);}
  .pl-rec .pl-rmeta{font-family:var(--font-ui);font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);position:relative;z-index:1;}
  .pl-rec-actions{display:flex;gap:12px;margin-top:2px;position:relative;z-index:1;}
  .pl-rec-actions button{background:none;border:none;padding:0;cursor:pointer;color:var(--accent-d);
    font-family:var(--font-ui);font-weight:700;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;transition:color .15s;}
  .pl-rec-actions button:hover{color:var(--accent);text-decoration:underline;}

  .shop{margin-top:8px;}
  .shop-sec{margin-bottom:22px;}
  .shop-sec h4{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);border-bottom:var(--bd-w) solid var(--line);padding-bottom:5px;margin:0 0 8px;}
  ul.shop-list{list-style:none;margin:0;padding:0;column-gap:40px;}
  ul.shop-list li{padding:6px 0;border-bottom:var(--li-border);display:flex;justify-content:space-between;
    gap:14px;align-items:baseline;font-size:15px;break-inside:avoid;}
  ul.shop-list .q{font-family:var(--font-ui);font-weight:700;white-space:nowrap;text-align:right;color:var(--ink);}
  ul.shop-list .src{opacity:.55;margin-left:6px;font-size:11px;}
  ul.shop-plain li{justify-content:flex-start;}
  .rayon{break-inside:avoid;margin-bottom:16px;}
  .rayon h5{font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent-d);margin:0 0 5px;border-bottom:var(--bd-w) solid var(--line);padding-bottom:4px;}
  @media(min-width:900px){.shop-cols{columns:2;column-gap:40px;}}

  /* ---- Sélecteur de recettes (choix manuel / remplacement) ---- */
  .pl-go.ghost{background:var(--surface-ctl);color:var(--accent-d);text-shadow:none;border-color:var(--bd);
    box-shadow:var(--sh-pill);}
  .pl-go.ghost:hover{background:var(--surface-hi);}
  .pl-go[disabled]{opacity:.45;cursor:default;box-shadow:none;}
  .pl-go[disabled]:hover{transform:none;box-shadow:none;}
  .pl-or{font-family:var(--font-body);font-style:italic;color:var(--ink-soft);font-size:15px;margin:14px 0;}

  .pick-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    position:sticky;top:0;z-index:12;padding:12px 10px;margin:0 -10px 16px;border-radius:var(--radius);
    background:var(--pickbar);backdrop-filter:var(--blur-bar);-webkit-backdrop-filter:var(--blur-bar);
    box-shadow:var(--sh-bar);}
  .pick-foot{display:flex;align-items:center;gap:14px;}
  .pick-facets{display:flex;flex-wrap:wrap;gap:4px 26px;margin:0 0 20px;}
  .pick-facets .facet{margin-top:0;}
  .pick-grid{grid-template-columns:repeat(auto-fill,minmax(188px,1fr));}
  .card.pick .card-title{font-size:16px;}
  .card.pick.picked{outline:2.5px solid var(--accent);outline-offset:-1px;
    box-shadow:var(--sh-picked);}
  .pickmark{position:absolute;top:8px;left:8px;z-index:4;width:26px;height:26px;border-radius:var(--round);
    display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:700;font-size:15px;
    background:var(--accent-fill-2);box-shadow:var(--sh-num);}

  /* ---- fluidité : entrée des vues ---- */
  .view-anim{animation:viewIn .34s cubic-bezier(.22,.9,.31,1);}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes cardPop{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:none;}}
  @keyframes sweep{from{left:-60%;}to{left:130%;}}

  @media(max-width:780px){
    .wrap{grid-template-columns:1fr;}
    .resize-handle{display:none;}
    .side{position:static;height:auto;border-right:none;border-bottom:var(--bd-w) solid var(--bd);}
    .filter-toggle{display:block;}
    #facets.collapsed{display:none;}
    .main{padding:22px 18px 60px;}
    .d-cols{grid-template-columns:1fr;gap:30px;}
    .d-title{font-size:27px;}
    .pl-title{font-size:25px;}
    .pl-controls{gap:18px;}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
  }

  /* --- en planification de courses, la colonne de gauche ne doit plus
         proposer les filtres de l'accueil : le planificateur a les siens --- */
  html[data-view="planner"] #facets,
  html[data-view="planner"] .search-wrap,
  html[data-view="planner"] #filterToggle{display:none;}

  /* =====================================================================
     STYLE 3 — ÉDITORIAL
     Le carnet lu comme un livre : papier crème uni, serif de labeur pour le
     texte, display à empattements pour les titres, sans-serif réservé aux
     mentions techniques. Aucune carte, aucune ombre, aucun aplat : la
     hiérarchie tient aux filets fins, aux capitales espacées et au blanc.
     Une recette sans photo n'est pas un trou — c'est une notice.
     ===================================================================== */
  html[data-style="editorial"]{
    --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-display:"Playfair Display",Georgia,"Times New Roman",serif;
    --font-body:"Newsreader",Georgia,serif;
    --font-text:"Newsreader",Georgia,serif;
    --font-note:"Newsreader",Georgia,serif;
    --fs-body:17px; --lh-body:1.62;
    --ls-label:.18em; --fw-label:600;
    --ls-title:-.01em; --fw-title:600; --lh-title:1.2;

    --page-bg:var(--sky5); --page-attach:scroll;

    --radius:2px; --card-radius:2px; --ctl-radius:2px; --pill:2px; --round:50%;

    --bd-w:1px; --bd:var(--line);
    --bd-focus:var(--accent); --bd-on:transparent;
    --surface-side:var(--sky3);
    --surface-card:transparent;
    --surface-ctl:transparent;
    --surface-panel:transparent;
    --surface-hi:var(--acc-soft); --surface-hi-soft:var(--acc-soft);
    --blur-side:none; --blur-card:none; --blur-bar:none; --blur-rec:none;

    --sh-in:none; --sh-in-soft:none; --sh-field:none;
    --sh-field-focus:none;
    --sh-card:none; --sh-card-hov:none; --sh-card-sm:none; --sh-card-sm-hov:none;
    --sh-hero:none; --sh-pill:none; --sh-pill-on:none;
    --sh-acc:none; --sh-acc-hov:none; --sh-acc-press:none; --sh-num:none;
    --sh-picked:none;
    --sh-bar:0 10px 34px -20px rgba(40,30,15,.5);   /* le panneau flotte : ombre discrète */

    --accent-fill:var(--accent);
    --accent-fill-2:var(--accent);
    --on-accent-sh:none;

    --gloss:0;
    --title-sh:none; --label-sh:none;
    --lift:0px;
    --card-lift:none; --card-lift-press:none; --card-lift-sm:none;
    --press:none;

    --thumb-bg:var(--acc-soft);
    --thumb-ratio:3/2;
    --li-border:1px solid var(--line);
    --sec-border:1px solid var(--ink);
    --ph-weight:400; --ph-tt:none; --ph-ls:0;
    --badge-radius:2px;
    --grid-min:228px; --grid-gap:36px;
  }
  /* --- pas de carte : une vignette, un titre, un filet --- */
  html[data-style="editorial"] .card{border:none;background:none;overflow:visible;}
  html[data-style="editorial"] .thumb{border:1px solid var(--line);}
  html[data-style="editorial"] .card-body{padding:11px 0 0;}
  html[data-style="editorial"] .card-title{font-size:21px;margin-top:4px;}
  html[data-style="editorial"] .card:hover .card-title{text-decoration:underline;
    text-underline-offset:4px;text-decoration-thickness:1px;}
  html[data-style="editorial"] .card:hover .thumb img{transform:none;}
  html[data-style="editorial"] .card-tags{font-family:var(--font-ui);font-size:9.5px;
    letter-spacing:.16em;text-transform:uppercase;font-weight:600;}
  html[data-style="editorial"] .card-meta{font-family:var(--font-ui);font-size:11px;
    letter-spacing:.04em;font-weight:400;}
  /* une recette sans photo : un cartouche en italique, pas un placeholder criard */
  html[data-style="editorial"] .thumb .ph,
  html[data-style="editorial"] .d-hero .ph{font-family:var(--font-body);font-style:italic;}
  html[data-style="editorial"] .thumb .ph{font-size:15px;}

  /* --- colonne de gauche : papier légèrement plus soutenu, filet fin --- */
  html[data-style="editorial"] .side{border-right:1px solid var(--line);}
  html[data-style="editorial"] .masthead{font-family:var(--font-display);font-size:34px;font-weight:500;}
  html[data-style="editorial"] .masthead small{font-family:var(--font-ui);letter-spacing:.24em;font-size:9px;}
  html[data-style="editorial"] .rule{background:var(--ink);height:1px;border-radius:0;margin:18px 0;}
  html[data-style="editorial"] .search{border:none;border-bottom:1px solid var(--line);
    border-radius:0;padding-left:2px;font-family:var(--font-body);font-weight:400;font-size:16px;}
  html[data-style="editorial"] .search:focus{border-bottom-color:var(--accent);}
  html[data-style="editorial"] .facet-head{border-bottom:1px solid var(--line);padding-bottom:5px;}

  /* --- titres et sections --- */
  html[data-style="editorial"] .d-title{font-size:46px;line-height:1.06;margin:6px 0 20px;}
  html[data-style="editorial"] .pl-title{font-size:40px;line-height:1.06;}
  html[data-style="editorial"] .group-h{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;}
  html[data-style="editorial"] .sec-h,
  html[data-style="editorial"] .pl-step{letter-spacing:.2em;font-size:10px;color:var(--ink);}
  html[data-style="editorial"] .pl-lead,
  html[data-style="editorial"] .pl-or{font-size:17px;}

  /* --- étapes : un chiffre à empattements, sans pastille --- */
  html[data-style="editorial"] ol.steps li{padding-left:52px;font-size:16.5px;padding-bottom:20px;}
  html[data-style="editorial"] ol.steps li::before{background:none;box-shadow:none;color:var(--accent);
    font-family:var(--font-display);font-size:27px;font-weight:400;width:38px;height:auto;
    top:-6px;justify-content:flex-start;}
  html[data-style="editorial"] ul.ing li{font-size:16.5px;}
  html[data-style="editorial"] ul.ing .q,
  html[data-style="editorial"] ul.shop-list .q{font-family:var(--font-body);font-weight:600;}
  html[data-style="editorial"] .notes{border:none;border-left:2px solid var(--accent);
    padding:2px 0 2px 18px;background:none;font-size:16px;}
  html[data-style="editorial"] .d-meta div{border:none;border-left:1px solid var(--line);
    border-radius:0;padding:2px 0 2px 14px;}
  html[data-style="editorial"] .d-meta{gap:26px;}

  /* --- surfaces flottantes : opaques, sinon illisibles sur le contenu --- */
  html[data-style="editorial"] .pick-bar{background:var(--sky5);border-bottom:1px solid var(--line);}
  html[data-style="editorial"] .themebar,
  html[data-style="editorial"] .appr-btn{background:var(--sky5);border:1px solid var(--line);}
  html[data-style="editorial"] .appr-btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);}
  /* survol : on repose TOUJOURS la couleur du texte avec le fond (sinon le texte disparaît sur le fond de survol) */
  html[data-style="editorial"] .chip:not(.on):hover,
  html[data-style="editorial"] .modebtn:not(.et):hover,
  html[data-style="editorial"] .sbtn:not(.on):hover,
  html[data-style="editorial"] .clear:hover,
  html[data-style="editorial"] .back:hover{background:var(--acc-soft);color:var(--ink);}
  html[data-style="editorial"] .chip.on:hover,
  html[data-style="editorial"] .modebtn.et:hover,
  html[data-style="editorial"] .sbtn.on:hover{background:var(--accent-d);}
  html[data-style="editorial"] .back:hover{transform:none;}

  /* =====================================================================
     STYLE 5 — VINTAGE IMPRIMÉ
     La fiche de cuisine des années 50-70, imprimée en DEUX ENCRES sur papier
     crème : une encre sombre pour le texte, une couleur d'appoint pour tout
     le reste. Papier légèrement inégal (dégradés très faibles, pas de motif
     répété qui moirerait à l'écran). Filets doubles, pointillés de conduite,
     capitales espacées. Les grands titres portent un léger décalage de la
     seconde encre — le défaut de repérage des presses bon marché.
     Une recette sans photo y est normale : ces livres étaient illustrés au
     trait, pas photographiés.
     ===================================================================== */
  html[data-style="vintage"]{
    --font-ui:"Zilla Slab",Rockwell,Georgia,serif;
    --font-display:"Zilla Slab",Rockwell,Georgia,serif;
    --font-body:"Zilla Slab",Rockwell,Georgia,serif;
    --font-text:"Zilla Slab",Rockwell,Georgia,serif;
    --font-note:"Zilla Slab",Rockwell,Georgia,serif;
    --fs-body:16px; --lh-body:1.58;
    --ls-label:.16em; --fw-label:600;
    --ls-title:0; --fw-title:600; --lh-title:1.14;

    --page-bg:radial-gradient(120% 80% at 18% 0%,rgba(90,60,20,.05),transparent 58%),
              radial-gradient(100% 70% at 88% 100%,rgba(90,60,20,.045),transparent 55%),
              var(--sky3);
    --page-attach:scroll;

    --radius:3px; --card-radius:3px; --ctl-radius:3px; --pill:3px; --round:50%;

    --bd-w:1px; --bd:var(--line);
    --bd-focus:var(--accent); --bd-on:var(--accent);
    --surface-side:var(--sky2);
    --surface-card:var(--sky5);
    --surface-ctl:var(--sky5);
    --surface-panel:var(--sky5);
    --surface-hi:var(--acc-soft); --surface-hi-soft:var(--acc-soft);
    --blur-side:none; --blur-card:none; --blur-bar:none; --blur-rec:none;

    --sh-in:none; --sh-in-soft:none; --sh-field:none;
    --sh-field-focus:0 0 0 2px var(--acc-line);
    --sh-card:3px 3px 0 var(--acc-soft);   --sh-card-hov:5px 5px 0 var(--acc-line);
    --sh-card-sm:2px 2px 0 var(--acc-soft);--sh-card-sm-hov:4px 4px 0 var(--acc-line);
    --sh-hero:4px 4px 0 var(--acc-soft);   --sh-bar:4px 4px 0 var(--acc-soft);
    --sh-pill:none;                        --sh-pill-on:none;
    --sh-acc:2px 2px 0 var(--acc-soft);    --sh-acc-hov:3px 3px 0 var(--acc-line);
    --sh-acc-press:1px 1px 0 var(--acc-soft); --sh-num:none;
    --sh-picked:4px 4px 0 var(--accent);

    --accent-fill:var(--accent);
    --accent-fill-2:var(--accent);
    --on-accent-sh:none;

    --gloss:0;
    --title-sh:none; --label-sh:none;
    --lift:-1px;
    --card-lift:translate(-2px,-2px);
    --card-lift-press:translate(1px,1px);
    --card-lift-sm:translate(-2px,-2px);
    --press:scale(.97);

    --thumb-bg:var(--sky4);
    --li-border:1px dotted var(--line);
    --sec-border:3px double var(--ink);
    --ph-weight:400; --ph-tt:none; --ph-ls:0;
    --badge-radius:3px;
    --grid-min:224px; --grid-gap:28px;
  }
  /* défaut de repérage : la seconde encre décalée sous les grands titres */
  html[data-style="vintage"] .masthead,
  html[data-style="vintage"] .d-title,
  html[data-style="vintage"] .pl-title{font-family:"Alfa Slab One","Zilla Slab",Rockwell,Georgia,serif;
    font-weight:400;text-shadow:2px 2px 0 var(--acc-line);}
  html[data-style="vintage"] .masthead{font-size:27px;line-height:1.05;}
  html[data-style="vintage"] .d-title{font-size:36px;line-height:1.1;}
  html[data-style="vintage"] .pl-title{font-size:32px;line-height:1.1;}
  html[data-style="vintage"] .masthead small{font-family:var(--font-ui);letter-spacing:.24em;}
  html[data-style="vintage"] .rule{background:none;height:0;border-top:3px double var(--ink);margin:16px 0;}
  /* la vignette vide est un cartouche au trait, pas un trou */
  html[data-style="vintage"] .thumb{border:1px dashed var(--line);}
  html[data-style="vintage"] .thumb .ph,
  html[data-style="vintage"] .d-hero .ph{font-style:italic;font-size:15px;}
  html[data-style="vintage"] .card:hover .thumb img{transform:none;}
  html[data-style="vintage"] .group-h{border-bottom:3px double var(--ink);font-size:11px;
    letter-spacing:.2em;color:var(--ink);}
  /* numéro d'étape : chiffre cerclé à l'encre d'appoint, pas de pastille pleine */
  html[data-style="vintage"] ol.steps li::before{background:none;border:2px solid var(--accent);
    color:var(--accent);font-family:var(--font-display);font-weight:600;font-size:15px;}
  html[data-style="vintage"] .notes{border-style:dashed;border-left:3px double var(--accent);}
  html[data-style="vintage"] .sec-h,
  html[data-style="vintage"] .pl-step{color:var(--ink);letter-spacing:.18em;}
  html[data-style="vintage"] .pick-bar{background:var(--sky4);border:1px solid var(--line);}
  html[data-style="vintage"] .themebar,
  html[data-style="vintage"] .appr-btn{background:var(--sky5);border:1px solid var(--line);}
  html[data-style="vintage"] .appr-btn[aria-expanded="true"]{background:var(--accent);
    color:var(--on-accent);border-color:var(--accent);}
  /* survol : la couleur du texte est toujours reposée avec le fond */
  html[data-style="vintage"] .chip:not(.on):hover,
  html[data-style="vintage"] .modebtn:not(.et):hover,
  html[data-style="vintage"] .sbtn:not(.on):hover,
  html[data-style="vintage"] .clear:hover,
  html[data-style="vintage"] .back:hover{background:var(--acc-soft);color:var(--ink);}
  html[data-style="vintage"] .chip.on:hover,
  html[data-style="vintage"] .modebtn.et:hover,
  html[data-style="vintage"] .sbtn.on:hover{background:var(--accent-d);color:var(--on-accent);}
  html[data-style="vintage"] .back:hover{transform:translate(-1px,-1px);}

  /* =====================================================================
     BASCULE VIGNETTES / COMPACT   (<html data-img="on|compact">)
     En mode compact : aucune image nulle part, cartes en lignes denses.
     ===================================================================== */
  html[data-img="compact"] .thumb,
  html[data-img="compact"] .d-hero{display:none;}
  html[data-img="compact"] .grid,
  html[data-img="compact"] .pick-grid{grid-template-columns:1fr;gap:5px;}
  html[data-img="compact"] .card{flex-direction:row;}
  html[data-img="compact"] .card-body{padding:10px 16px;display:flex;align-items:baseline;gap:18px;width:100%;}
  html[data-img="compact"] .card-title{order:1;flex:1 1 auto;font-size:16px;margin:0;}
  html[data-img="compact"] .card-tags{order:2;flex:0 0 auto;text-align:right;}
  html[data-img="compact"] .card-meta{order:3;flex:0 0 auto;margin-top:0;white-space:nowrap;}
  html[data-img="compact"] .card:hover{transform:translateX(3px);}
  html[data-img="compact"] .card::before{height:100%;}
  html[data-img="compact"] .card.pick.picked .card-title::before{content:"✓ ";color:var(--accent);}
  html[data-img="compact"] .d-title{margin-bottom:14px;}
  html[data-img="compact"] .group-h{margin-top:22px;}
  @media(max-width:600px){
    html[data-img="compact"] .card-body{flex-wrap:wrap;gap:4px 14px;}
    html[data-img="compact"] .card-title{flex:1 0 100%;}
  }

  /* =====================================================================
     MENU APPARENCE (style + palette + images)
     ===================================================================== */
  .appr-btn{width:100%;margin-top:16px;
    font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:10px;border-radius:var(--radius);cursor:pointer;
    background:var(--surface-ctl);border:var(--bd-w) solid var(--bd);color:var(--ink-soft);
    box-shadow:var(--sh-in);transition:transform .12s,background .15s;}
  .appr-btn:hover{background:var(--surface-hi);transform:translateY(var(--lift));}
  .appr-btn[aria-expanded="true"]{background:var(--accent-fill);color:var(--on-accent);
    text-shadow:var(--on-accent-sh);border-color:transparent;}
  .themebar[hidden]{display:none;}
  .themebar{margin-top:9px;
    display:flex;flex-direction:column;gap:9px;padding:13px 16px;border-radius:var(--radius);
    background:var(--surface-ctl);border:var(--bd-w) solid var(--bd);
    box-shadow:var(--sh-in);
    /* le panneau vit dans la barre latérale défilante : pleine largeur de la
       colonne, il coule dans le défilement du menu (plus de popover fixe). */
    width:100%;}
  /* Chaque ligne coule (flex + retour à la ligne) : quand la colonne est
     étroite (210 px minimum) ou le texte agrandi, un bouton passe à la ligne
     suivante au lieu d'être coupé (« VIGN… ») ou de déborder (pastilles). */
  .tb-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px 6px;}
  .tb-row .tb-label{flex-basis:100%;}
  .themebar .tb-label{font-family:var(--font-ui);font-size:9.5px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);opacity:.85;
    grid-column:1/-1;margin-bottom:-2px;}
  .sbtn{font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    border:var(--bd-w) solid var(--bd);background:var(--surface-ctl);color:var(--ink-soft);
    padding:4px 8px;border-radius:var(--pill);cursor:pointer;line-height:1.5;text-align:center;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    box-shadow:var(--sh-in);transition:transform .12s,background .15s,color .15s;}
  .sbtn:hover{background:var(--surface-hi);transform:translateY(var(--lift));}
  .sbtn:active{transform:scale(.94);}
  .sbtn.on{color:var(--on-accent);border-color:transparent;text-shadow:var(--on-accent-sh);
    background:var(--accent-fill);box-shadow:var(--sh-pill-on);}
  /* Pastille de palette : un disque bicolore, rien d'autre.
     - appearance:none : sinon le rendu natif du <button> se superpose au nôtre
       (c'est de là que venait la boîte parasite).
     - aucune bordure : l'anneau est un box-shadow, qui suit le rayon et
       n'ajoute pas de boîte. Une bordure translucide laissait voir le dégradé
       au travers, d'où l'anneau clair et sale.
     - le disque est rond dans TOUS les styles : c'est un témoin de couleur,
       pas un élément de la grammaire du style. */
  .tdot{appearance:none;-webkit-appearance:none;
    width:22px;height:22px;flex:0 0 auto;padding:0;margin:0;border:none;
    border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px var(--line);
    transition:transform .15s var(--ease-pop),box-shadow .15s;}
  .tdot:hover{transform:scale(1.15);}
  .tdot.on{box-shadow:0 0 0 2px var(--ink);}
  @media print{.themebar,.appr-btn,.resize-handle{display:none;}}
  /* Mode : 3 boutons qui se partagent la ligne sans jamais tronquer « Sombre »
     (capitales espacées en Vintage et Éditorial) */
  /* Dans le panneau, jamais de texte tronqué : le bouton garde sa largeur
     de contenu et s'étire pour remplir sa ligne. */
  .themebar .sbtn{flex:1 1 auto;min-width:auto;overflow:visible;padding-left:10px;padding-right:10px;}
  .tb-styles .sbtn{flex-grow:0;}
  .tb-pal{gap:8px;padding:2px 0;}

  /* =====================================================================
     PALETTES SOMBRES
     Une palette peut se déclarer sombre (dark:true) : le JS pose alors
     data-dark sur <html>. color-scheme prévient le navigateur, ce qui rend
     les ascenseurs et les champs natifs sombres eux aussi.
     ===================================================================== */
  html[data-dark]{color-scheme:dark;}

  /* --------------------------------------------------------------------
     PALETTE DU PREMIER RENDU (Vintage / Rouge cerise)
     Valeurs relevées sur la palette calculée, recopiées ici en dur pour
     que la page soit JUSTE dès le premier pixel. Le script les repose
     ensuite à l'identique en style en ligne sur :root — aucun changement
     visible. Si un jour on déverrouille le thème, ces lignes ne gênent
     pas : le style en ligne posé par le script les emporte toujours.
     -------------------------------------------------------------------- */
  html[data-style="vintage"]{
    --sky1:#e2d5bd; --sky2:#ebe0cc; --sky3:#f1e9da; --sky4:#f6f1e6; --sky5:#faf6ee;
    --ink:#2b2119; --ink-soft:#645344;
    --accent:#ae292d; --accent-d:#841f22; --acc-l:#ae292d;
    --warn:#4f5c28; --on-accent:#faf6ee;
    --line:rgba(43,33,25,.28);
    --acc-glow:rgba(174,41,45,.72); --acc-line:rgba(174,41,45,.4); --acc-soft:rgba(174,41,45,.15);
    --ph-color:rgba(43,33,25,.78); --ink-a16:rgba(43,33,25,.16); --ink-a30:rgba(43,33,25,.3);
  }
  html[data-style="vintage"][data-dark]{
    --sky1:#151515; --sky2:#212121; --sky3:#272727; --sky4:#2d2d2d; --sky5:#313131;
    --ink:#f3e4d9; --ink-soft:#b59d8a;
    --accent:#d1343b; --accent-d:#ff6b70; --acc-l:#d1343b;
    --warn:#abbd75; --on-accent:#faf6ee;
    --line:rgba(243,228,217,.28);
    --acc-glow:rgba(209,52,59,.72); --acc-line:rgba(209,52,59,.4); --acc-soft:rgba(209,52,59,.15);
    --ph-color:rgba(243,228,217,.78); --ink-a16:rgba(243,228,217,.16); --ink-a30:rgba(243,228,217,.3);
  }

  /* =====================================================================
     VINTAGE SOMBRE — ce qui vaut sur papier crème ne vaut pas sur fond sombre
     ---------------------------------------------------------------------
     Le style Vintage imite deux encres imprimées sur un papier crème. En
     sombre, le papier n'existe plus : garder ses artifices revient à filtrer
     le thème clair, pas à le transposer. Trois artifices sont donc coupés,
     et rien d'autre :

     1. Les deux dégradés radiaux bruns du fond. Ils simulaient l'inégalité
        du papier ; sur fond sombre ils se lisent comme un voile chaud posé
        sur l'écran — exactement l'effet « mode nuit » à éviter. Fond plat.
     2. Le décalage de la seconde encre sous les grands titres (le défaut de
        repérage des presses bon marché). Sur fond clair c'est une citation
        typographique ; sur fond sombre, une ombre colorée décalée ne cite
        plus rien, elle ressemble à un défaut de rendu.
     3. Le fond teinté des vignettes vides, qui empâtait les cartes.
     ===================================================================== */
  html[data-style="vintage"][data-dark]{
    --page-bg:var(--sky2);
    --thumb-bg:var(--sky3);
  }
  html[data-style="vintage"][data-dark] .masthead,
  html[data-style="vintage"][data-dark] .d-title,
  html[data-style="vintage"][data-dark] .pl-title{text-shadow:none;}

  /* =====================================================================
     RÉDUCTION DU BRUIT  (2026-09)
     ---------------------------------------------------------------------
     Diagnostic : la page portait trop de signaux de même force. Chaque
     correction ci-dessous retire un signal qui ne distinguait rien, ou
     rend à l'accent son rôle de pointeur unique.
     ===================================================================== */

  /* 1. La ligne de tags au-dessus du titre était en accent, graisse 700 :
        elle se lisait AVANT le titre, alors qu'elle ne sert qu'à confirmer.
        Elle redevient une mention secondaire. */
  .card-tags{color:var(--ink-soft);font-weight:600;opacity:.85;}

  /* 2. L'accent ne remplit plus les commandes de navigation. Retour,
        « tout effacer » et les tags de la fiche sont des repères, pas des
        actions à provoquer : ils passent à l'encre. Le rouge reste pour
        UNE action principale (planifier), l'état actif d'un filtre, les
        numéros d'étape et les étoiles. */
  .clear{color:var(--ink-soft);}
  .back{color:var(--ink-soft);}
  .d-tag{color:var(--ink-soft);}

  /* 3. Vignette absente. Le cartouche répétait le titre de la recette juste
        au-dessus du titre de la recette : cette redondance-là est retirée,
        il ne reste qu'une mention discrète.
        EN REVANCHE la vignette GARDE SA HAUTEUR dans la liste. Première
        tentative : on la réduisait à un bandeau plat pour récupérer le vide.
        Résultat, dans une même rangée, les cartes sans photo voyaient leur
        titre remonter de ~150 px pendant que les autres restaient en bas :
        la grille perdait sa ligne de base commune, ce qui coûte plus à la
        lecture que le vide ne coûtait. Une grille de cartes ne se lit que
        si les cartes ont la même anatomie.
        Sur la FICHE il n'y a pas de voisine avec qui s'aligner : là, le
        cartouche est bien réduit à un bandeau, et les 500 px de vide sont
        récupérés pour de bon. */
  .thumb .ph{font-size:12px;opacity:.45;padding:10px;}
  .d-hero .ph{aspect-ratio:auto;font-size:13px;padding:14px;opacity:.45;}

  /* 4. Vocabulaire de filets : la carte portait un cadre plein ET une
        vignette en tirets. Un seul filet suffit à dire « carte ». */
  html[data-style="vintage"] .thumb{border:none;border-bottom:1px solid var(--line);}

  /* 5. Les 46 pastilles de filtre avaient chacune un cadre et une ombre :
        46 boutons de même poids. Sans cadre, elles forment une matière que
        l'œil balaie, et seule la pastille ACTIVE reste un objet. */
  html[data-style="vintage"] .chip:not(.on){border-color:transparent;background:var(--sky4);box-shadow:none;}
  html[data-style="vintage"] .chip:not(.on):hover{background:var(--acc-soft);}

  /* 6. Facettes repliables. Tout reste ouvert par défaut : rien ne change
        tant qu'on n'a pas replié soi-même. L'état est mémorisé. */
  .facet-head{cursor:pointer;}
  .facet-name{display:flex;align-items:baseline;gap:6px;background:none;border:none;padding:0;margin:0;
    cursor:pointer;color:inherit;font:inherit;text-align:left;flex:1;}
  .facet-caret{font-size:9px;opacity:.55;transition:transform .15s;display:inline-block;}
  .facet.closed .facet-caret{transform:rotate(-90deg);}
  .facet.closed .chips{display:none;}
  .facet.closed .modebtn{display:none;}
  .facet-on{font-size:10px;font-weight:700;color:var(--accent);}

  /* =====================================================================
     NOTES — étoiles 1 à 5 et favori
     ---------------------------------------------------------------------
     Sur 119 cartes, afficher cinq étoiles partout aurait ajouté 595 glyphes
     à une page dont le défaut était déjà l'encombrement. Règle retenue :
     une carte NON NOTÉE ne montre rien ; ses étoiles n'apparaissent qu'au
     survol ou au focus clavier. Une carte notée montre sa note en
     permanence — c'est elle qui porte l'information.
     ===================================================================== */
  .note-row{display:flex;align-items:center;gap:10px;margin-top:9px;min-height:22px;
    opacity:0;transition:opacity .15s;}
  .card:hover .note-row,
  .card:focus-within .note-row,
  .card[data-noted] .note-row{opacity:1;}
  /* Les étoiles sont posées dans l'ordre 5→1 et affichées en row-reverse :
     elles se lisent bien 1→5 de gauche à droite, mais « l'étoile survolée et
     toutes celles qui la précèdent » devient exprimable en CSS seul
     (.st:hover ~ .st), sans écouteur de survol en JS. */
  .stars{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;gap:1px;}
  .st{background:none;border:none;padding:0 1px;margin:0;cursor:pointer;line-height:1;
    font-size:15px;color:var(--ink-a30);transition:color .12s,transform .12s;}
  .st.on{color:var(--accent);}
  .stars:hover .st{color:var(--ink-a30);}
  .stars .st:hover,.stars .st:hover ~ .st{color:var(--accent);}
  .stars .st:hover{transform:scale(1.15);}
  .st:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px;}
  .wish{background:none;border:none;padding:0 2px;margin:0;cursor:pointer;line-height:1;
    font-size:14px;color:var(--ink-a30);transition:color .12s,transform .12s;}
  .wish:hover{transform:scale(1.15);}
  /* Le cœur prend l'accent : c'est un jugement porté sur la recette, au même
     titre que la note. Il reste dans les deux encres du thème. */
  .wish[aria-pressed="true"]{color:var(--accent);}
  .wish{font-size:15px;}
  .wish:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px;}
  .note-clear{background:none;border:none;padding:0 2px;cursor:pointer;color:var(--ink-a30);
    font-size:13px;line-height:1;opacity:0;transition:opacity .12s,color .12s;}
  .note-row:hover .note-clear{opacity:1;}
  .note-clear:hover{color:var(--ink-soft);}

  /* fiche détaillée : la note est une information de premier plan, elle est
     donc toujours visible et à une taille lisible. */
  .d-note{display:flex;align-items:center;gap:14px;margin:0 0 18px;flex-wrap:wrap;}
  .d-note .note-row{opacity:1;margin-top:0;}
  .d-note .st{font-size:24px;}
  .d-note .wish{font-size:19px;}
  .d-note .note-lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:var(--ls-label);
    text-transform:uppercase;font-weight:700;color:var(--ink-soft);}

  /* tri et filtre par note */
  .sortbar{display:inline-flex;align-items:center;gap:7px;margin-left:auto;}
  /* Un des deux boutons de tri est TOUJOURS actif. Le remplir d'accent posait
     donc une pastille rouge permanente dans le coin de l'écran, en
     concurrence directe avec la seule action principale de la page. L'état
     actif se dit ici par l'encre et un filet, pas par un aplat. */
  .sortbtn{font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 2px;margin-left:10px;cursor:pointer;
    border:none;background:none;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .sortbtn:hover{color:var(--ink);}
  .sortbtn.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent);}

  /* panneau « Mes notes » */
  .notes-panel{margin-top:9px;display:grid;gap:9px;
    background:var(--surface-panel);border:var(--bd-w) solid var(--bd);border-radius:var(--radius);
    padding:12px;box-shadow:var(--sh-bar);}
  .notes-panel[hidden]{display:none;}
  .notes-panel p{margin:0;font-size:11.5px;line-height:1.45;color:var(--ink-soft);}
  .notes-panel .warnline{color:var(--warn);font-weight:700;}
  .npbtn{font-family:var(--font-ui);font-size:12px;font-weight:700;padding:8px 10px;cursor:pointer;
    border:var(--bd-w) solid var(--bd);border-radius:var(--ctl-radius);
    background:var(--surface-ctl);color:var(--ink);}
  .npbtn:hover{background:var(--surface-hi);}
  .npbtn.primary{background:var(--accent-fill-2);color:var(--on-accent);border-color:transparent;}
  /* =====================================================================
     GESTION DES IMAGES depuis la page
     ===================================================================== */
  .d-imgbar{display:flex;align-items:center;gap:10px;margin:-8px 0 22px;flex-wrap:wrap;}
  .imgbtn{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;padding:6px 13px;border-radius:var(--ctl-radius);cursor:pointer;
    border:var(--bd-w) solid var(--bd);background:var(--surface-ctl);color:var(--ink-soft);}
  .imgbtn:hover{background:var(--surface-hi);color:var(--ink);}
  .imgbtn[aria-expanded="true"]{background:var(--accent-fill-2);color:var(--on-accent);border-color:transparent;}
  .img-src{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-soft);opacity:.8;}

  .img-panel{display:grid;gap:9px;max-width:560px;margin:0 0 22px;
    background:var(--surface-panel);border:var(--bd-w) solid var(--bd);border-radius:var(--radius);
    padding:14px;box-shadow:var(--sh-bar);}
  .img-panel[hidden]{display:none;}
  .img-panel p{margin:0;font-size:11.5px;line-height:1.45;color:var(--ink-soft);}
  .img-panel .err{color:var(--warn);font-weight:700;}
  .img-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .img-url{flex:1;min-width:220px;padding:8px 10px;border:var(--bd-w) solid var(--bd);
    border-radius:var(--ctl-radius);background:var(--surface-ctl);color:var(--ink);
    font-family:var(--font-ui);font-size:12.5px;}
  .img-url:focus{outline:none;border-color:var(--bd-focus);}

  /* =====================================================================
     AUDIT DU 3 OCTOBRE 2026 — corrections (sauvegarde : .sauvegardes/*avant-audit-apple)
     ===================================================================== */
  /* l'animation d'entrée des cartes ne rejoue pas à chaque filtre */
  html[data-grid-pret] .card{animation:none;}
  /* carte atteignable au clavier : anneau de focus visible */
  .card:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  /* le décalage de repérage du titre ne doit pas être hérité par le sous-titre de 10 px */
  .masthead small{text-shadow:none;}
  /* écrans tactiles : zones de toucher d'au moins ~44 px, sans changer le dessin */
  @media (pointer:coarse){
    .d-note .st,.d-note .wish{min-width:40px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
    .wbtn{position:relative;}
    .wbtn::after{content:"";position:absolute;inset:-13px;}
    .back,.imgbtn,.appr-btn{min-height:44px;}
  }
  /* PASTILLE D'ÉTAT — ce que la page est en train d'enregistrer sur GitHub.
     Neutre et identique dans les trois styles : c'est un message système,
     pas un élément du carnet. Fixée en bas, au-dessus de la barre d'accueil
     de l'iPhone. */
  .etat-envoi{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:1000;
    transform:translate(-50%,14px);opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;min-height:44px;box-sizing:border-box;
    max-width:min(560px,calc(100vw - 32px));border-radius:22px;
    font-family:var(--font-ui);font-size:14px;font-weight:600;line-height:1.3;letter-spacing:0;
    background:rgba(28,28,30,.92);color:#fff;border:1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
    box-shadow:0 10px 30px rgba(0,0,0,.28);transition:opacity .22s ease,transform .22s ease;}
  .etat-envoi.visible{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .etat-envoi[data-etat="erreur"]{background:rgba(179,38,30,.96);align-items:flex-start;flex-wrap:wrap;
    width:min(560px,calc(100vw - 32px));padding:12px 12px 10px 14px;border-radius:18px;font-weight:500;}
  .etat-envoi .ee-texte{flex:1 1 auto;}
  .etat-envoi[data-etat="erreur"] .ee-texte{flex-basis:calc(100% - 28px);}
  .etat-envoi .ee-actions{display:flex;gap:8px;margin-left:auto;}
  .etat-envoi .ee-signe{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .etat-envoi button{flex:none;font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.18);
    border:none;border-radius:14px;padding:6px 11px;cursor:pointer;}
  .etat-envoi button:hover{background:rgba(255,255,255,.28);}
  .rond-envoi{display:block;width:16px;height:16px;border-radius:50%;box-sizing:border-box;
    border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:rond-envoi .8s linear infinite;}
  .point-attente{display:block;width:9px;height:9px;border-radius:50%;background:#fff;animation:point-attente 1.4s ease-in-out infinite;}
  @keyframes rond-envoi{to{transform:rotate(360deg);}}
  @keyframes point-attente{0%,100%{opacity:.35;}50%{opacity:1;}}
  /* photo en cours d'envoi : aperçu voilé à sa place sur la fiche */
  .d-hero.en-envoi img{filter:brightness(.55) saturate(.85);}
  .d-hero .voile-envoi{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    color:#fff;font-family:var(--font-ui);font-size:15px;font-weight:600;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.45);}
  .d-hero .voile-envoi .rond-envoi{width:30px;height:30px;border-width:3px;}
  @media(prefers-reduced-motion:reduce){
    .etat-envoi{transition:opacity .2s;transform:translate(-50%,0);}
    .rond-envoi{animation-duration:2.4s;} .point-attente{animation:none;opacity:1;}
  }
  /* LECTURE SEULE (visiteurs, ou navigateur sans clé GitHub) : les étoiles
     déjà posées restent visibles mais inertes, rien d'autre ne s'affiche. */
  html:not([data-proprio]) .card:not([data-noted]) .note-row,
  html:not([data-proprio]) .d-note:not([data-noted]),
  html:not([data-proprio]) .note-clear,
  html:not([data-proprio]) .d-fin .d-imgbar,
  html:not([data-proprio]) .d-fin .img-panel{display:none;}
  html:not([data-proprio]) .note-row button{pointer-events:none;cursor:default;}
  html:not([data-proprio]) .note-row .st:not(.on),
  html:not([data-proprio]) .note-row .wish[aria-pressed="false"]{display:none;}
  /* la base n'est rappelée que lorsqu'on s'en écarte (elle doublait le sélecteur) */
  .serve-base{margin:-8px 0 14px;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-soft);}
  /* --- 3 octobre (2) : vignette-titre, planificateur en action secondaire --- */
  /* Vignette-titre : discrète (encre secondaire, filet fin, italique) et
     JAMAIS tronquée. La taille est en cqi, donc proportionnelle à la vignette
     (format fixe 4/3) : le rapport texte / cadre ne dépend pas de l'écran.
     ajusterTitres() réduit en plus la police si un titre déborde quand même. */
  html[data-style] .thumb .ph.ph-titre{opacity:1;padding:0;position:absolute;inset:7%;display:flex;
    align-items:center;justify-content:center;border:1px solid var(--line);
    text-transform:none;letter-spacing:0;font-style:normal;overflow:hidden;}
  .ph-titre span{display:block;padding:0 8%;font-family:var(--font-display);font-style:italic;font-weight:500;
    font-size:clamp(13px,7cqi,22px);line-height:1.22;color:var(--ink-soft);text-align:center;text-wrap:balance;}
  .d-fin{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);}
  .d-fin .d-note{margin-bottom:12px;}
  /* en sombre, l'accent de remplissage est un vrai rouge trop foncé pour servir de texte :
     les usages « texte » passent à --accent-d (rouge clair, 4,5:1) */
  html[data-dark] ol.steps li::before,
  html[data-dark] ul.ing .q.flash,
  html[data-dark] .facet-on,
  html[data-dark] .pl-rec-actions button:hover,
  html[data-dark][data-img="compact"] .card.pick.picked .card-title::before{color:var(--accent-d);}
  html[data-style="vintage"][data-dark] ol.steps li::before{border-color:var(--accent-d);}
  /* survol d'un élément rempli : en sombre --accent-d est clair (rôle texte), on fonce donc l'accent */
  html[data-style="vintage"][data-dark] .chip.on:hover,
  html[data-style="vintage"][data-dark] .modebtn.et:hover,
  html[data-style="vintage"][data-dark] .sbtn.on:hover{background:color-mix(in srgb,var(--accent) 82%,#000);}
  #planBtn{margin-top:12px;}
  .thumb{container-type:inline-size;}
  @media(max-width:780px){
    /* sur téléphone, la fiche s'ouvre sur la recette, pas sur la colonne de filtres */
    html[data-view="detail"] .side{display:none;}
  }

  /* =====================================================================
     STYLE 7 — LIQUID GLASS  (3 octobre 2026, skill liquid-glass-web)
     ---------------------------------------------------------------------
     RETOUR ARRIÈRE : choisir un autre style dans « Apparence » (tous accessibles).
     Copie intégrale de l'état précédent :
       .sauvegardes/recettes.html.2026-10-03_203925.avant-liquid-glass

     Deux couches, comme chez Apple (iOS 26 / macOS Tahoe) :
       · NAVIGATION en verre : la colonne de gauche (panneau flottant), la
         barre de sélection du planificateur, le bouton Retour de la fiche
         (capsule collante, avec réfraction des bords sous Chromium/Brave).
       · CONTENU sur surfaces opaques : cartes, fiche, ingrédients, étapes.
         Du texte long sur du verre devient illisible dès que le fond change.
     Le fond de page porte trois halos de couleur fixes : sans matière
     derrière lui, le verre n'est qu'un gris pâle.
     Jetons --lg-* repris de lg.css (skill liquid-glass-web) ; tout le reste
     de ce bloc en dérive.
     ===================================================================== */
  html[data-style="glass"]{
    /* ---- jetons Apple — clair ---- */
    --lg-font:system-ui,-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --lg-r-sm:10px; --lg-r-md:14px; --lg-r-lg:22px; --lg-r-xl:28px; --lg-r-pill:999px;
    --lg-ease:cubic-bezier(.25,1,.5,1); --lg-dur-fast:120ms; --lg-dur:280ms;
    --lg-orange:#ff9500; --lg-purple:#af52de;
    --lg-bg:#f2f2f7; --lg-surface:#ffffff; --lg-surface-2:#f2f2f7;
    --lg-fill:rgba(120,120,128,.12); --lg-fill-2:rgba(120,120,128,.20);
    --lg-separator:rgba(60,60,67,.22);
    --lg-seg-on:#ffffff;
    --lg-seg-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);
    --lg-glass-tint:rgba(255,255,255,.72); --lg-glass-tint-2:rgba(255,255,255,.55);
    --lg-glass-edge:rgba(255,255,255,.75); --lg-glass-rim:rgba(0,0,0,.06);
    --lg-glass-shadow:0 8px 32px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
    --lg-glass-blur:22px; --lg-glass-sat:180%;
    --lg-card-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px -8px rgba(0,0,0,.14);
    --lg-card-shadow-hov:0 2px 4px rgba(0,0,0,.05),0 26px 40px -18px color-mix(in srgb,var(--accent) 55%,transparent);
    --lg-blob-1:24%; --lg-blob-2:20%; --lg-blob-3:14%;
    --lg-panel:color-mix(in srgb,var(--lg-surface) 72%,transparent);

    /* ---- palette du premier rendu (le script repose exactement la même) ---- */
    --sky1:#e5e5ea; --sky2:#ebebf0; --sky3:#f2f2f7; --sky4:#f9f9fb; --sky5:#ffffff;
    --ink:#1d1d1f; --ink-soft:#6e6e73; --masthead:#1d1d1f;
    --accent:#d70015; --accent-d:#b5000f; --acc-l:#d70015;
    --warn:#c93400; --on-accent:#ffffff;
    --line:rgba(29,29,31,.28);
    --acc-glow:rgba(215,0,21,.72); --acc-line:rgba(215,0,21,.4); --acc-soft:rgba(215,0,21,.15);
    --ph-color:rgba(29,29,31,.78); --ink-a16:rgba(29,29,31,.16); --ink-a30:rgba(29,29,31,.3);

    /* ---- jetons du carnet ramenés sur les jetons Apple ---- */
    --font-ui:var(--lg-font); --font-display:var(--lg-font); --font-body:var(--lg-font);
    --font-text:var(--lg-font); --font-note:var(--lg-font);
    --fs-body:17px; --lh-body:1.47;
    --ls-label:0; --tt-label:none; --fw-label:600;
    --ls-title:-.02em; --fw-title:700; --lh-title:1.2;

    --page-bg:
      radial-gradient(55% 45% at 0% 0%,color-mix(in srgb,var(--accent) var(--lg-blob-1),transparent),transparent 72%),
      radial-gradient(45% 40% at 100% 0%,color-mix(in srgb,var(--lg-orange) var(--lg-blob-2),transparent),transparent 72%),
      radial-gradient(60% 55% at 12% 100%,color-mix(in srgb,var(--lg-purple) var(--lg-blob-3),transparent),transparent 72%),
      var(--lg-bg);
    --page-attach:fixed;

    --radius:var(--lg-r-md); --card-radius:var(--lg-r-lg); --ctl-radius:var(--lg-r-sm);
    --pill:var(--lg-r-pill); --round:50%;

    --bd-w:1px; --bd:transparent; --bd-focus:var(--accent); --bd-on:transparent;
    --surface-side:transparent;
    --surface-card:var(--lg-surface);
    --surface-ctl:var(--lg-fill);
    --surface-panel:var(--lg-surface);
    --surface-hi:var(--lg-fill-2); --surface-hi-soft:var(--lg-fill-2);
    --blur-side:blur(var(--lg-glass-blur)) saturate(var(--lg-glass-sat));
    --blur-card:none; --blur-rec:none;
    --blur-bar:blur(var(--lg-glass-blur)) saturate(var(--lg-glass-sat));

    --sh-in:none; --sh-in-soft:none; --sh-field:none;
    --sh-field-focus:0 0 0 3px var(--acc-line);
    --sh-card:var(--lg-card-shadow);       --sh-card-hov:var(--lg-card-shadow-hov);
    --sh-card-sm:var(--lg-card-shadow);    --sh-card-sm-hov:var(--lg-card-shadow-hov);
    --sh-hero:var(--lg-card-shadow);       --sh-bar:var(--lg-glass-shadow);
    --sh-pill:none; --sh-pill-on:none;
    --sh-acc:none; --sh-acc-hov:none; --sh-acc-press:none; --sh-num:none;
    --sh-picked:var(--lg-card-shadow-hov);

    --accent-fill:var(--accent); --accent-fill-2:var(--accent); --on-accent-sh:none;
    --gloss:0; --title-sh:none; --label-sh:none;
    --lift:0px;
    --card-lift:translateY(-5px); --card-lift-press:translateY(-2px) scale(.99);
    --card-lift-sm:translateY(-2px); --press:scale(.96);
    --ease-pop:var(--lg-ease);

    --thumb-bg:var(--lg-surface-2);
    --li-border:1px solid var(--lg-separator);
    --sec-border:0 solid transparent;
    --ph-weight:500; --ph-tt:none; --ph-ls:0;
    --badge-radius:var(--lg-r-pill);
    --grid-min:220px; --grid-gap:20px;
  }
  /* ---- jetons Apple — sombre (data-dark est posé par le menu Apparence) ---- */
  html[data-style="glass"][data-dark]{
    --lg-orange:#ff9f0a; --lg-purple:#bf5af2;
    --lg-bg:#000000; --lg-surface:#1c1c1e; --lg-surface-2:#2c2c2e;
    --lg-fill:rgba(120,120,128,.24); --lg-fill-2:rgba(120,120,128,.36);
    --lg-separator:rgba(84,84,88,.6);
    --lg-seg-on:#636366;
    --lg-seg-shadow:0 3px 8px rgba(0,0,0,.3);
    --lg-glass-tint:rgba(36,36,40,.66); --lg-glass-tint-2:rgba(36,36,40,.5);
    --lg-glass-edge:rgba(255,255,255,.22); --lg-glass-rim:rgba(255,255,255,.06);
    --lg-glass-shadow:0 8px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    --lg-card-shadow:0 0 0 .5px rgba(255,255,255,.07),0 8px 24px -12px rgba(0,0,0,.7);
    --lg-card-shadow-hov:0 0 0 .5px rgba(255,255,255,.12),0 26px 40px -18px color-mix(in srgb,var(--accent) 60%,transparent);
    --lg-blob-1:30%; --lg-blob-2:16%; --lg-blob-3:18%;

    --sky1:#000000; --sky2:#0c0c0d; --sky3:#161618; --sky4:#1c1c1e; --sky5:#2c2c2e;
    --ink:#f5f5f7; --ink-soft:#98989f; --masthead:#f5f5f7;
    --accent:#e0242c; --accent-d:#ff6961; --acc-l:#e0242c;
    --warn:#ff9f0a; --on-accent:#ffffff;
    --line:rgba(245,245,247,.28);
    --acc-glow:rgba(224,36,44,.72); --acc-line:rgba(224,36,44,.4); --acc-soft:rgba(224,36,44,.15);
    --ph-color:rgba(245,245,247,.78); --ink-a16:rgba(245,245,247,.16); --ink-a30:rgba(245,245,247,.3);
  }

  html[data-style="glass"] body{letter-spacing:-.01em;font-optical-sizing:auto;}
  html[data-style="glass"] :focus-visible{outline:3px solid var(--acc-line);outline-offset:2px;}

  /* ---------- NAVIGATION : la colonne de gauche, panneau de verre flottant ---------- */
  html[data-style="glass"] .side{top:10px;height:calc(100vh - 20px);margin:10px 0 10px 10px;
    padding:24px 16px 40px;border:none;border-radius:var(--lg-r-xl);
    background:linear-gradient(180deg,var(--lg-glass-tint),var(--lg-glass-tint-2));
    box-shadow:var(--lg-glass-shadow),inset 0 1px .5px var(--lg-glass-edge),
      inset 0 -1px .5px var(--lg-glass-rim),inset 0 0 0 .5px var(--lg-glass-edge);
    scrollbar-width:thin;scrollbar-color:var(--lg-fill-2) transparent;}
  html[data-style="glass"] .masthead{font-size:2.125rem;font-weight:700;letter-spacing:-.025em;
    line-height:1.12;color:var(--ink);padding:0 4px;}
  html[data-style="glass"] .masthead small{font-size:.8125rem;letter-spacing:0;text-transform:none;
    font-weight:500;color:var(--ink-soft);margin-top:4px;}
  html[data-style="glass"] .rule{height:1px;border-radius:0;background:var(--lg-separator);margin:16px 4px;}

  /* recherche : capsule remplie, loupe dessinée en masque (suit la couleur du mode) */
  html[data-style="glass"] .search-wrap::before{content:"";position:absolute;left:12px;top:50%;
    width:15px;height:15px;transform:translateY(-50%);background:var(--ink-soft);pointer-events:none;
